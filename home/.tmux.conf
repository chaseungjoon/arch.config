# ╔══════════════════════════════════════════════╗
# ║  ~/.tmux.conf :: AMBER-76 retro              ║
# ║  prefix = Ctrl+S                             ║
# ╚══════════════════════════════════════════════╝

# ── prefix ────────────────────────────────────────
unbind C-b
set -g prefix C-s
bind C-s send-prefix            # Ctrl+S twice sends a real Ctrl+S to the app

# ── basics ────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB"
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#W"
setw -g mode-keys vi
set -g status-keys emacs
set -g display-time 1500

# ── keys (after Ctrl+S) ───────────────────────────
# panes: vim motions, resize with H J K L (repeatable)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4
# splits / windows open in the current directory
bind '\' split-window -h -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"
bind x   kill-pane
bind z   resize-pane -Z
bind Tab last-window
bind r   source-file ~/.tmux.conf \; display "▓▒░ config reloaded"
# copy mode: v to select, y to copy to the system clipboard
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"

# ── AMBER-76 look ─────────────────────────────────
# bg0 #1c1b19  bg1 #2a2723  bg2 #3c3833  dim #9a8f7a  fg #e8dcc0
# amber #ffb000  orange #e8742c  red #d0453b  mustard #f2c14e  green #8fb339  teal #3e9d9a
set -g status on
set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#2a2723,fg=#9a8f7a"

# left: session name block (turns orange while the prefix is held)
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[bg=#e8742c],#[bg=#ffb000]}#[fg=#1c1b19,bold] #S #[default] "

# windows: dim inactive, amber active, red on activity/bell
setw -g window-status-format         "#[fg=#9a8f7a] #I:#W#{?window_zoomed_flag,+,} "
setw -g window-status-current-format "#[bg=#3c3833,fg=#ffb000,bold] #I:#W#{?window_zoomed_flag,+,} "
setw -g window-status-activity-style "fg=#d0453b"
setw -g window-status-bell-style     "fg=#1c1b19,bg=#d0453b"
setw -g window-status-separator ""

# right: host · date · time, then the 70s stripes
set -g status-right-length 80
set -g status-right "#[fg=#9a8f7a]#H #[fg=#4a453e]┃ #[fg=#e8dcc0]%a %d %b #[bg=#3e9d9a,fg=#1c1b19,bold] %H:%M #[bg=#d0453b] #[bg=#e8742c] #[bg=#f2c14e] #[bg=#8fb339] "

# panes
set -g pane-border-style        "fg=#3c3833"
set -g pane-active-border-style "fg=#ffb000"
set -g pane-border-lines single
set -g display-panes-colour        "#9a8f7a"
set -g display-panes-active-colour "#ffb000"

# messages, copy mode, clock
set -g message-style         "bg=#ffb000,fg=#1c1b19,bold"
set -g message-command-style "bg=#2a2723,fg=#ffb000"
setw -g mode-style           "bg=#f2c14e,fg=#1c1b19"
setw -g clock-mode-colour    "#ffb000"
setw -g clock-mode-style     24
