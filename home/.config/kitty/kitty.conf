# kitty :: AMBER-76 retro terminal  (no transparency, no blinking, no animations)

# ── font (Terminus is pixel-crisp at 16px = 12pt @ 96dpi) ──
font_family      Terminess Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures always
adjust_line_height 0

# ── cursor: solid amber block, no blink, no trail ──
cursor_shape          block
cursor_blink_interval 0
cursor_trail          0
cursor                #ffb000
cursor_text_color     #1c1b19

# ── performance / no effects ──
background_opacity    1.0
dynamic_background_opacity no
repaint_delay         10
input_delay           3
sync_to_monitor       yes
enable_audio_bell     no
visual_bell_duration  0
window_alert_on_bell  yes
linux_display_server  x11

# ── window ──
window_padding_width  4 8
placement_strategy    top-left
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size  no
enabled_layouts       splits,stack
inactive_text_alpha   1.0
active_border_color   #ffb000
inactive_border_color #3c3833
window_border_width   1px
draw_minimal_borders  yes

# ── scrollback ──
scrollback_lines      10000
scrollback_pager      less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 2.0

# ── mouse / urls ──
url_color             #3e9d9a
url_style             straight
open_url_with         default
copy_on_select        clipboard
strip_trailing_spaces smart
mouse_hide_wait       3.0

# ── tab bar: DOS-style status strip ──
tab_bar_edge          bottom
tab_bar_style         separator
tab_separator         " "
tab_title_template    " {index}:{title[:24]} "
active_tab_title_template " {index}:{title[:24]} "
tab_bar_min_tabs      2
active_tab_foreground   #1c1b19
active_tab_background   #ffb000
active_tab_font_style   bold
inactive_tab_foreground #9a8f7a
inactive_tab_background #2a2723
inactive_tab_font_style normal
tab_bar_background      #282828

# ── AMBER-76 colour scheme ──
foreground            #e8dcc0
background            #282828
selection_foreground  #1c1b19
selection_background  #f2c14e
mark1_background      #3e9d9a
mark2_background      #e8742c
mark3_background      #b5679b

# black
color0  #1c1b19
color8  #5a544a
# red
color1  #d0453b
color9  #ef6a5a
# green
color2  #8fb339
color10 #b5d36a
# yellow / amber
color3  #f2a33a
color11 #ffcf5c
# blue
color4  #4f7cac
color12 #78a2d2
# magenta
color5  #b5679b
color13 #d58fc0
# cyan / teal
color6  #3e9d9a
color14 #6fc3c0
# white
color7  #d8ccb0
color15 #f4ead2

# ── shell ──
shell_integration     no-cursor
term                  xterm-kitty

# ── keys (kitty_mod = ctrl+shift) ──
map kitty_mod+enter   launch --cwd=current --location=split
map kitty_mod+\       launch --cwd=current --location=vsplit
map kitty_mod+h       neighboring_window left
map kitty_mod+j       neighboring_window down
map kitty_mod+k       neighboring_window up
map kitty_mod+l       neighboring_window right
map kitty_mod+z       toggle_layout stack
map kitty_mod+t       new_tab_with_cwd
map kitty_mod+equal   change_font_size all +1.0
map kitty_mod+0       change_font_size all 0
map kitty_mod+f5      load_config_file
